type Query {
  """
  Admin only: Dashboard overview with KYC stats, weekly submission trends, average review time, and recent admin activity.
  """
  adminDashboard: AdminDashboardPayload!

  """
  Admin only: Paginated dispute queue. Defaults to disputeStatus="flagged" (review queue). FIFO order.
  """
  adminDisputes(input: AdminDisputesInput): DisputeConnection!

  """
  Admin only: Get full KYC detail for a single caregiver. Includes profile, documents with signed URLs (1hr), and review history.
  """
  adminKycDetail(caregiverId: ID!): AdminKycDetailPayload!

  """
  Admin only: Get paginated list of caregiver KYC submissions. Filter by status, search by name. Pending items shown first.
  """
  adminKycList(input: AdminKycListInput!): AdminKycListPayload!

  """
  Admin only: Paginated payments list filtered by status (default: captured = pending transfer). Sorted oldest-first (FIFO).
  """
  adminPayments(input: AdminPaymentsInput): PaymentConnection!

  """
  Admin only: Get full user detail including caregiver info, KYC status, suspension state, and audit log count.
  """
  adminUserDetail(
    """UUID of the user"""
    userId: ID!
  ): AdminUserDetailPayload!

  """
  Admin only: Get paginated list of users. Filter by role, search by name/email. Newest users first.
  """
  adminUserList(input: AdminUserListInput!): AdminUserListPayload!

  """
  Caregiver's full booking history (all statuses), optionally filtered by status and date range, newest first.
  """
  caregiverBookingHistory(input: CaregiverBookingHistoryInput = {}): CaregiverBookingListResponse!

  """
  Caregiver bookings filtered by status (pending=new requests, accepted=awaiting patient, confirmed+upcoming=active jobs).
  """
  caregiverBookings(input: CaregiverBookingsInput!): CaregiverBookingListResponse!

  """
  รายการรีวิวที่มองเห็นได้ของ caregiver (ใหม่สุดก่อน) พร้อม pagination — public
  """
  caregiverReviews(input: CaregiverReviewsInput!): CaregiverReviewsResponse!

  """Health check - API & DB Status"""
  health: HealthStatus!

  """Get KYC status with full details for the Status Page"""
  kycStatus: KycStatusPayload!

  """
  All authenticated users: Get all currently locked fields for an entity. Caregivers need this to know which fields they cannot edit.
  """
  lockedFields(entityId: String!, entityType: EntityTypeEnum!): [LockedField!]!

  """Get current logged-in user"""
  me: User!

  """Returns a single booking by ID for the authenticated patient."""
  myBooking(id: ID!): BookingSummary!

  """
  Returns the patient's full booking history, optionally filtered by status, newest first.
  """
  myBookingHistory(input: BookingHistoryInput = {}): BookingListResponse!

  """Get current caregiver profile"""
  myCaregiverProfile: Caregiver!

  """
  Returns the current caregiver's work condition (availability + service locations + job types + service area). Verified caregivers only.
  """
  myWorkCondition: WorkCondition!

  """List notifications of current user (newest first)"""
  notifications(limit: Int = 20, offset: Int = 0, unreadOnly: Boolean = false): [Notification!]!

  """ประวัติการเปลี่ยนสถานะของ payment (เรียงเก่า → ใหม่)"""
  paymentHistory(paymentId: ID!): [PaymentStatusHistory!]!

  """
  Search caregivers with filters (province, district, job type, price range, min rating). Only returns verified + searchable caregivers who have at least one active availability slot.
  """
  searchCaregivers(input: SearchCaregiverInput = {}): SearchCaregiverPayload!

  """Count of unread notifications for current user"""
  unreadCount: Int!
}

