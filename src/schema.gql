type JobEvent {
  """ความแม่นยำของตำแหน่ง (เมตร)"""
  accuracyM: Int

  """
  true = แถวนี้มีอยู่ก่อนแล้ว ระบบคืนของเดิมให้ ไม่ได้สร้างใหม่ (กดปุ่มซ้ำ) — FE ไม่ต้องขึ้น error
  """
  alreadyCheckedIn: Boolean!
  bookingId: ID!

  """เวลาที่เครื่อง client อ้าง — metadata เท่านั้น"""
  deviceTs: DateTime

  """ระยะจากจุดงาน (เมตร). null = คำนวณไม่ได้ — ไม่ได้แปลว่าทำผิด"""
  distanceM: Int

  """'check_in' | 'check_out'"""
  eventType: String!

  """
  true = สัญญาณตำแหน่งไม่แม่นพอที่จะเชื่อ distanceM → ระบบจะไม่ติดธงใด ๆ เลย. FE เอาไปโชว์ชิป "สัญญาณอ่อน"
  """
  gpsAccuracyLow: Boolean!
  id: ID!

  """
  true = booking ใบนี้ไม่มีพิกัดจุดงาน (booking เก่าทุกใบเป็นแบบนี้) → คำนวณระยะไม่ได้ และไม่ติดธง
  """
  jobCoordsMissing: Boolean!

  """ละติจูดที่บันทึกไว้ (null = ไม่ได้ให้สิทธิ์ตำแหน่ง)"""
  lat: Float

  """ลองจิจูดที่บันทึกไว้"""
  lng: Float

  """บันทึกปิดงาน (ใช้ตอน check_out)"""
  note: String

  """signed URL ของรูปหลักฐาน — หมดอายุใน 1 ชม."""
  photoUrl: String

  """
  ธงที่เหตุการณ์นี้ทำให้เกิดขึ้น (array ว่าง = ไม่มีปัญหา) เช่น out_of_radius / out_of_window / clock_anomaly
  """
  reviewReasons: [String!]!

  """เวลาที่เซิร์ฟเวอร์บันทึก — เวลาที่ถือเป็นทางการ"""
  serverTs: DateTime!

  """
  'caregiver' = ผู้ดูแลกดเอง | 'system' = ระบบปิดให้อัตโนมัติ (งานที่ระบบปิดให้ ไม่นับว่า valid)
  """
  source: String!

  """
  true = อยู่ในรัศมีปกติ (≤ WARN_RADIUS_M). false = นอกรัศมีแนะนำ แต่ยังไม่ถึงขั้นติดธง. null = ตัดสินไม่ได้
  """
  withinWarnRadius: Boolean
}

type JobQr {
  """booking ที่ QR ใบนี้ผูกอยู่"""
  bookingId: ID!

  """
  true = ตอนนี้สแกนได้จริง (อยู่ในช่วงเวลา + ยังไม่ปิดงาน). FE เอาไปตัดสินว่าจะโชว์ QR หรือโชว์ข้อความ "ยังไม่ถึงเวลา / หมดเวลาแล้ว"
  """
  isActive: Boolean!

  """
  สแกนครั้งต่อไปจะเป็น action อะไร: CHECK_IN | CHECK_OUT | null (ปิดงานแล้ว ไม่เหลือ action). FE เอาไปเขียนหัวข้อบนหน้าจอ. ★ ใช้ enum ตัวเดียวกับที่ scanJobQr คืนกลับมา จะได้ไม่ต้องมีคำศัพท์สองชุด
  """
  nextAction: ScanAction

  """
  PENDING = ยังไม่เช็คอิน | CHECKED_IN = กำลังทำงาน | CHECKED_OUT = ปิดงานแล้ว
  """
  status: JobSessionStatus!

  """
  ★ ข้อความลับที่เอาไปวาดเป็น QR — วาดตรง ๆ ทั้งสตริง ห้ามเติม prefix/URL. เฉพาะ patient เจ้าของงานเท่านั้นที่ขอค่านี้ได้
  """
  token: String!

  """สแกนได้ตั้งแต่เมื่อไหร่ (ก่อนเวลานัดได้ตามค่า config)"""
  validFrom: DateTime!

  """สแกนได้ถึงเมื่อไหร่ (เลยเวลาเลิกงานได้ตามค่า config)"""
  validUntil: DateTime!
}

type JobScanResult {
  """
  สิ่งที่การสแกนครั้งนี้ทำ (หรือพยายามจะทำ) — ตัดสินจากสถานะของ QR ไม่ใช่จากตัว QR เอง
  """
  action: ScanAction!

  """งานที่ QR ใบนี้ผูกอยู่ — null เมื่อหา QR ไม่เจอ (ยังไม่รู้ว่าเป็นงานใบไหน)"""
  bookingId: ID

  """
  หลักฐานการทำงานที่เพิ่งถูกบันทึก (มีเฉพาะตอน ok = true) — เอาไปโชว์ระยะทาง/ธงต่อได้เลย โดยไม่ต้องยิง proofOfWork ซ้ำ
  """
  jobEvent: JobEvent

  """
  ข้อความภาษาไทยที่แสดงให้ผู้ดูแลอ่านได้ทันที (แสดงตรง ๆ ได้เลย ไม่ต้องแปลง)
  """
  message: String!

  """
  true = งานขยับจริง (เช็คอินหรือเช็คเอาท์สำเร็จ). false = ถูกปฏิเสธ ดูสาเหตุที่ result
  """
  ok: Boolean!

  """รหัสผลลัพธ์ — ใช้ค่านี้เลือกหน้าจอ ไม่ใช่ message"""
  result: ScanResult!

  """เวลาที่เซิร์ฟเวอร์บันทึกการสแกนครั้งนี้ — เวลาที่ถือเป็นทางการ"""
  scannedAt: DateTime!

  """
  สถานะของ QR 'หลัง' การสแกนครั้งนี้. null เมื่อหา QR ไม่เจอ (ยังไม่รู้ว่าเป็นใบไหน)
  """
  sessionStatus: JobSessionStatus
}

"""
สถานะของใบ QR — เดินหน้าทางเดียว PENDING → CHECKED_IN → CHECKED_OUT. ไม่มีสถานะ "ยกเลิก" เพราะเรื่องนั้นอ่านจากสถานะของ booking
"""
enum JobSessionStatus {
  CHECKED_IN
  CHECKED_OUT
  PENDING
}

