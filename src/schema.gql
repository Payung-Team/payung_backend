type Mutation {
  """Caregiver accepts a pending booking request (pending → accepted)."""
  acceptBooking(bookingId: ID!): CaregiverBookingSummary!

  """
  Admin only: Activate a suspended user (set isActive = true, is_deleted = false). Records audit log.
  """
  activateUser(
    """UUID of the user to activate"""
    userId: ID!
  ): User!

  """
  Admin only: Edit a regular user profile (displayName, email, phone, address, bio). Cannot be used on admin/super_admin accounts — use editAdminInfo instead. Syncs email to Supabase Auth if changed. Records audit log.
  """
  adminEditUser(input: AdminEditUserInput!): User!

  """
  Admin only: Edit caregiver personal info (firstName, lastName, idCardNumber, email). Email change syncs to Supabase Auth. idCardNumber must be exactly 13 digits. Records audit log.
  """
  adminUpdateCaregiverInfo(input: AdminUpdateCaregiverInfoInput!): AdminUpdateCaregiverInfoPayload!

  """
  Admin only: Approve a caregiver KYC submission. Sets kycStatus = "verified", records audit log, sends notification + email. Requires kycStatus = "pending".
  """
  approveKyc(
    """UUID of the caregiver to approve"""
    caregiverId: ID!
  ): Caregiver!

  """
  Caregiver cancels a previously accepted booking before patient confirmation, with a required reason (accepted → rejected).
  """
  cancelAcceptance(input: CancelAcceptanceInput!): CaregiverBookingSummary!

  """
  Super Admin only: Cancel a scheduled deletion for an admin account. Reactivates the account and unbans Supabase Auth.
  """
  cancelScheduledDelete(input: CancelScheduledDeleteInput!): CancelScheduledDeletePayload!

  """
  Admin only: Change a user role. Only patient (1) ↔ caregiver (2) allowed. Cannot change own role or escalate to admin/super_admin. Records audit log.
  """
  changeUserRole(input: ChangeUserRoleInput!): User!

  """
  ผู้ดูแลเช็คอินเพื่อเริ่มงาน (confirmed → in_progress). ★ GPS ไม่เคยทำให้ล้มเหลว — พิกัดเพี้ยนหรือไม่มีพิกัดเลยก็เช็คอินได้ ระบบแค่ติดธงไว้ให้แอดมินดู. กดซ้ำได้ ไม่ error และไม่เกิดแถวใหม่.
  """
  checkInBooking(input: CheckInInput!): JobEvent!

  """
  ผู้ดูแลเช็คเอาท์เพื่อ "ปิดงาน" (in_progress → awaiting_release ถ้าไม่มีธง, → needs_review ถ้ามี). ★ ผู้รับบริการไม่ต้องกดยืนยันอะไรอีก. แนบบันทึกและรูปได้ 1 รูป (ต้องเป็นไฟล์ใน bucket ของเราเท่านั้น). การ์ดนี้ไม่แตะเงิน — การ capture เป็นงานของ Epic 2.
  """
  checkOutBooking(input: CheckOutInput!): JobEvent!

  """
  Patient or caregiver completes a confirmed booking: captures the held charge (payment held → captured) and marks the booking completed (confirmed → completed).
  """
  completeBooking(bookingId: ID!): CompleteBookingResult!

  """
  Clear the mustChangePassword flag after the user has changed their password via Supabase Auth. Call this AFTER supabase.auth.updateUser({ password }) succeeds on the frontend.
  """
  completePasswordChange: User!

  """Patient confirms a booking that has been accepted by the caregiver."""
  confirmBooking(bookingId: ID!): BookingSummary!

  """
  จองผู้ดูแลแทนผู้รับบริการที่ถูกแชร์ไว้ในกลุ่มครอบครัว. ผู้เรียกต้องเป็นสมาชิก ACTIVE ของกลุ่ม (ไม่งั้น NOT_A_MEMBER) และโปรไฟล์ต้องอยู่ในกลุ่มเดียวกัน (ไม่งั้น RECIPIENT_NOT_IN_GROUP). ★ ยังไม่รวมขั้นตอนจ่ายเงิน — จ่ายเป็น step แยกเหมือนการจองปกติทุกประการ.
  """
  createBookingOnBehalf(input: CreateBookingOnBehalfInput!): BookingSummary!

  """
  สร้างกลุ่มครอบครัวใหม่ — ผู้สร้างกลายเป็นเจ้าของ (OWNER) ทันที. ผู้ใช้ที่ล็อกอินแล้วทุกคนสร้างได้ และสร้างได้หลายกลุ่ม.
  """
  createFamilyGroup(input: CreateFamilyGroupInput!): FamilyGroup!
  createPayment(input: CreatePaymentInput!): Payment!

  """Patient เขียนรีวิวให้ caregiver หลังงาน completed (1 รีวิว/booking)"""
  createReview(input: CreateReviewInput!): ReviewItem!

  """
  Caregiver declines a pending booking request with a required reason (pending → rejected).
  """
  declineBooking(input: DeclineBookingInput!): CaregiverBookingSummary!

  """
  ลบกลุ่ม (เจ้าของเท่านั้น). สมาชิก/คำเชิญ/ฟีดกิจกรรม ถูกลบตาม. ★ โปรไฟล์ผู้รับบริการและประวัติการจอง "ไม่ถูกลบ" — แค่ถูกตัดความเชื่อมโยงกับกลุ่ม (family_group_id = null).
  """
  deleteFamilyGroup(groupId: ID!): DeleteFamilyGroupResult!

  """Delete a KYC document (allowed only when status is rejected or none)"""
  deleteKycDocument(documentId: String!): Boolean!

  """
  Super Admin only: Edit an admin account (name, email, role). Syncs email to Supabase Auth. Protects the last active Super Admin from demotion. Records audit log.
  """
  editAdminInfo(input: EditAdminInfoInput!): EditAdminInfoPayload!

  """
