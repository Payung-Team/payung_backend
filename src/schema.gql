  """
  flagBookingDispute(input: FlagDisputeInput!): DisputeBooking!

  """Admin ซ่อนรีวิว (is_visible=false) เช่นรีวิวไม่เหมาะสม"""
  hideReview(reviewId: ID!): ReviewItem!

  """
  Super Admin only: Invite a new Admin (role=3) or Super Admin (role=4). Creates Supabase auth user + DB record, sends invitation email with temp password.
  """
  inviteAdmin(input: InviteAdminInput!): InviteAdminPayload!

  """
  ออกจากกลุ่มด้วยตัวเอง — คืน id + ชื่อกลุ่มที่เพิ่งออกมา เพราะหลังออกแล้วจะอ่านกลุ่มนั้นไม่ได้อีก. ★ เจ้าของออกเองไม่ได้ → LAST_OWNER ต้องโอนสิทธิ์ให้คนอื่นหรือลบกลุ่มก่อน.
  """
  leaveFamilyGroup(groupId: ID!): LeaveFamilyGroupResult!

  """Login user with email and password"""
  login(input: LoginInput!): AuthPayload!

  """Logout user"""
  logout: Boolean!

  """Mark all notifications of current user as read"""
  markAllAsRead: Boolean!

  """Mark a single notification as read"""
  markAsRead(id: String!): Notification!

  """
  Admin only: Mark a captured payment as transferred to the caregiver. Requires paymentStatus = "captured". Uses FSM for atomic status update + audit history.
  """
  markPaymentTransferred(notes: String, paymentId: ID!, transferRef: String!): Payment!

  """
  Admin only: Refund a captured payment (full or partial). amount omitted = full refund. amount specified must be in (0, payment.amount]. Uses Omise-Idempotency-Key to prevent double-refund races.
  """
  refundPayment(input: RefundPaymentInput!): Payment!

  """Register a new user"""
  register(input: RegisterInput!): AuthPayload!

  """
  Admin only: Reject a caregiver KYC submission with one or more structured reasons. Stores reasons as JSONB, sets kycStatus = "rejected", records audit log, sends notification + email. Requires kycStatus = "pending". At least one reason with a title is required.
  """
  rejectKyc(input: RejectKycInput!): Caregiver!

  """
  นำสมาชิกออกจากกลุ่ม (เจ้าของเท่านั้น) — สิทธิ์ทั้งหมดของคนนั้นหายทันที. นำตัวเองออกไม่ได้ → LAST_OWNER.
  """
  removeMember(input: RemoveMemberInput!): FamilyGroup!

  """
  เปลี่ยนชื่อกลุ่ม (เจ้าของเท่านั้น). ชื่อว่างหรือเกิน 80 ตัวอักษร → GROUP_NAME_INVALID.
  """
  renameFamilyGroup(input: RenameFamilyGroupInput!): FamilyGroup!

  """
  Send a password reset link to the given email address. Always returns success=true regardless of whether the email exists.
  """
  requestPasswordReset(input: RequestPasswordResetInput!): RequestPasswordResetResponse!

  """
  Admin only: Resolve a flagged dispute (no_refund | refund_full | refund_partial). refund_partial requires refundAmount in (0, payment.amount]. refund_full / refund_partial call PaymentService.refundPayment (PYG-286).
  """
  resolveDispute(input: ResolveDisputeInput!): DisputeBooking!

  """Resubmit KYC after rejection (caregiver only, status must be rejected)"""
  resubmitKyc(input: KycInput!): Caregiver!

  """
  ผู้ดูแลสแกน QR ของงานเพื่อเริ่มหรือจบงาน. ★ สแกนครั้งแรก = เช็คอิน, ครั้งที่สอง = เช็คเอาท์ — ผู้เรียก "ไม่ได้เลือก" ว่าจะทำอะไร สถานะของ QR เป็นตัวตัดสิน. ★ การสแกนที่ถูกปฏิเสธจะ "ไม่ throw error" แต่คืน ok=false พร้อมรหัสเหตุผลใน result (ทุกครั้งถูกบันทึกไว้เสมอ ทั้งสำเร็จและล้มเหลว).
  """
  scanJobQr(input: ScanJobQrInput!): JobScanResult!

  """
  Super Admin only: Schedule permanent deletion of an admin account after a grace period. Immediately deactivates the account and bans Supabase Auth. Grace period: 7, 14, 30, or 60 days.
  """
  scheduleDeleteAdmin(input: ScheduleDeleteAdminInput!): ScheduleDeleteAdminPayload!

  """Toggle caregiver availability in search results (verified only)"""
  setSearchable(isSearchable: Boolean!): Caregiver!

  """Submit KYC information (caregiver only)"""
  submitKyc(input: KycInput!): Caregiver!

  """
  Admin only: Suspend a user (set isActive = false). Cannot suspend yourself. Records audit log.
  """
  suspendUser(
    """UUID of the user to suspend"""
    userId: ID!
  ): User!

  """
  Super Admin only: Activate or deactivate an admin account. Deactivate revokes Supabase Auth sessions (ban). Activate clears any scheduled deletion. Sends notification email.
  """
  toggleAdminStatus(input: ToggleAdminStatusInput!): ToggleAdminStatusPayload!

  """
  Admin only: Lock or unlock a specific field of a caregiver profile or user. Locked fields cannot be edited by the user until unlocked. Records audit log.
  """
  toggleFieldLock(input: ToggleFieldLockInput!): FieldLockResult!

