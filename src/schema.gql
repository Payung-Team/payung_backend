  """
  Admin only: ผลรวม aggregate ของ transactions ตาม filter เดียวกับ list (count/ยอดรวมของ payment/payout/refund + net) (PYG-333)
  """
  adminTransactionSummary(input: AdminTransactionsInput): TransactionTotals!

  """
  Admin only: รายการ transactions รวม (payment + payout + refund) filter: type, status, dateFrom/dateTo (created_at), q (booking id / omise id / ชื่อ / อีเมล). default: ทุกประเภท เรียง created_desc (ใหม่สุดก่อน) (PYG-333)
  """
  adminTransactions(input: AdminTransactionsInput): TransactionSummaryConnection!

  """
