  ดู payment ของ booking — สำหรับ FE PromptPay polling (เปิดให้ patient/caregiver/admin). ถ้า payment ยังเป็น pending + paymentMethod=promptpay จะ retrieve charge จาก Omise สด ๆ แล้ว reconcile ถ้า user จ่ายแล้ว (กันเคส webhook เลทหรือหาย).
  """
  paymentByBooking(bookingId: ID!): Payment

